openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: dashboard
    description: Dashboard summaries
  - name: projects
    description: Construction projects
  - name: trades
    description: Trade directory
  - name: invoices
    description: Invoice intake and approval
  - name: vendor-quotes
    description: Vendor and subcontractor quote management
  - name: users
    description: Workspace user administration
  - name: storage
    description: Persistent object upload and serving
  - name: project-imports
    description: AI-assisted project folder initialization
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get dashboard summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /projects:
    get:
      operationId: getProjects
      tags: [projects]
      summary: List accessible projects
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
        - name: region
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Project list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
    post:
      operationId: createProject
      tags: [projects]
      summary: Create a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectInput"
      responses:
        "201":
          description: Created project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
  /projects/{projectId}:
    get:
      operationId: getProject
      tags: [projects]
      summary: Get a project
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Project details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectDetail"
        "404":
          description: Project not found
    patch:
      operationId: updateProject
      tags: [projects]
      summary: Update a project
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUpdate"
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
  /projects/{projectId}/panoramas:
    post:
      operationId: createProjectPanorama
      tags: [projects]
      summary: Add a panorama to a project
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PanoramaInput"
      responses:
        "201":
          description: Created panorama
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Panorama"
        "400":
          description: Invalid panorama upload
        "404":
          description: Project not found
        "500":
          description: Panorama could not be persisted
  /projects/{projectId}/panoramas/{panoramaId}:
    patch:
      operationId: updateProjectPanorama
      tags: [projects]
      summary: Update panorama details
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: panoramaId
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PanoramaUpdate"
      responses:
        "200":
          description: Updated panorama
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Panorama"
        "400":
          description: Invalid panorama details
        "404":
          description: Project or panorama not found
        "500":
          description: Panorama details could not be persisted
  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [storage]
      summary: Request a direct upload URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Upload URL generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
        "400":
          description: Invalid file metadata
        "500":
          description: Upload URL could not be generated
  /storage/objects/{objectPath}:
    get:
      operationId: getStorageObject
      tags: [storage]
      summary: Serve a stored object
      parameters:
        - name: objectPath
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Stored object
          content:
            "*/*":
              schema: { type: string, format: binary }
        "403":
          description: Access denied
        "404":
          description: Object not found
  /project-imports:
    post:
      operationId: createProjectImport
      tags: [project-imports]
      summary: Build a project from privately uploaded folder documents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectImportInput"
      responses:
        "201":
          description: Project initialized from the document import
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectImport"
        "400":
          description: Invalid imported document metadata
        "422":
          description: Import could not be interpreted
  /project-import-sessions:
    post:
      operationId: createProjectImportSession
      tags: [project-imports]
      summary: Create a durable folder import session before uploading
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectImportSessionInput"
      responses:
        "201":
          description: Import session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectImportSession"
    get:
      operationId: getActiveProjectImportSession
      tags: [project-imports]
      summary: Restore the latest unfinished folder import
      responses:
        "200":
          description: Active import session, or null
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ProjectImportSession"
                  - type: "null"
  /project-import-sessions/{importId}/documents:
    post:
      operationId: attachProjectImportDocument
      tags: [project-imports]
      parameters:
        - $ref: "#/components/parameters/ImportId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectImportDocument"
      responses:
        "200":
          description: Uploaded document attached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectImportSession"
  /project-import-sessions/{importId}/build:
    post:
      operationId: buildProjectImportSession
      tags: [project-imports]
      parameters:
        - $ref: "#/components/parameters/ImportId"
      responses:
        "201":
          description: Project initialized from attached documents
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectImport"
  /projects/{projectId}/activity:
    get:
      operationId: getProjectActivity
      tags: [projects]
      summary: Get project activity
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Activity feed
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Activity"
  /projects/{projectId}/organize-files:
    post:
      operationId: organizeProjectFiles
      tags: [projects]
      summary: Organize imported project files with AI
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Files organized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizeProjectFilesResult"
  /trades:
    get:
      operationId: getTrades
      tags: [trades]
      summary: List trades
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: tradeType
          in: query
          schema:
            type: string
        - name: region
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Trade directory
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Trade"
  /trades/{tradeId}:
    get:
      operationId: getTrade
      tags: [trades]
      summary: Get a trade profile
      parameters:
        - $ref: "#/components/parameters/TradeId"
      responses:
        "200":
          description: Trade profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TradeDetail"
  /invoices:
    get:
      operationId: getInvoices
      tags: [invoices]
      summary: List invoices
      parameters:
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Invoice list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Invoice"
    post:
      operationId: createInvoice
      tags: [invoices]
      summary: Submit an invoice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvoiceInput"
      responses:
        "201":
          description: Created invoice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
  /vendor-quotes:
    get:
      operationId: getVendorQuotes
      tags: [vendor-quotes]
      summary: List and filter vendor quotes
      parameters:
        - name: search
          in: query
          schema: { type: string }
        - name: projectId
          in: query
          schema: { type: string }
        - name: vendorId
          in: query
          schema: { type: string }
        - name: trade
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/VendorQuoteStatus"
      responses:
        "200":
          description: Vendor quote list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VendorQuote"
    post:
      operationId: createVendorQuote
      tags: [vendor-quotes]
      summary: Create a vendor quote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VendorQuoteInput"
      responses:
        "201":
          description: Created vendor quote
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VendorQuote"
        "400":
          description: Invalid quote
        "404":
          description: Project or vendor not found
  /vendor-quotes/{quoteId}:
    get:
      operationId: getVendorQuote
      tags: [vendor-quotes]
      summary: Get a vendor quote
      parameters:
        - $ref: "#/components/parameters/QuoteId"
      responses:
        "200":
          description: Vendor quote
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VendorQuote"
        "404":
          description: Quote not found
    patch:
      operationId: updateVendorQuote
      tags: [vendor-quotes]
      summary: Update a vendor quote
      parameters:
        - $ref: "#/components/parameters/QuoteId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VendorQuoteUpdate"
      responses:
        "200":
          description: Updated vendor quote
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VendorQuote"
        "400":
          description: Invalid quote
        "404":
          description: Quote, project, or vendor not found
  /users/me:
    get:
      operationId: getCurrentWorkspaceUser
      tags: [users]
      summary: Get the current workspace identity and role
      responses:
        "200":
          description: Current workspace user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentWorkspaceUser"
        "401":
          description: Authentication required
  /users:
    get:
      operationId: getWorkspaceUsers
      tags: [users]
      summary: List workspace users
      responses:
        "200":
          description: Workspace user list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkspaceUser"
        "401":
          description: Authentication required
        "403":
          description: Administrator access required
  /users/invitations:
    get:
      operationId: getWorkspaceInvitations
      tags: [users]
      summary: List pending workspace invitations
      responses:
        "200":
          description: Pending workspace invitation list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkspaceInvitation"
        "401":
          description: Authentication required
        "403":
          description: Administrator access required
    post:
      operationId: inviteWorkspaceUser
      tags: [users]
      summary: Invite a user with an initial workspace role
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceInvitationInput"
      responses:
        "201":
          description: Invitation sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceInvitation"
        "400":
          description: Invalid invitation
        "401":
          description: Authentication required
        "403":
          description: Administrator access required
        "409":
          description: Email is already invited or registered
        "502":
          description: Identity provider rejected the invitation
  /users/invitations/{invitationId}/resend:
    post:
      operationId: resendWorkspaceInvitation
      tags: [users]
      summary: Resend a pending workspace invitation
      parameters:
        - $ref: "#/components/parameters/InvitationId"
      responses:
        "200":
          description: Replacement invitation sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceInvitation"
        "401":
          description: Authentication required
        "403":
          description: Administrator access required
        "404":
          description: Pending invitation not found
        "502":
          description: Identity provider rejected the invitation
  /users/invitations/{invitationId}:
    delete:
      operationId: revokeWorkspaceInvitation
      tags: [users]
      summary: Revoke a pending workspace invitation
      parameters:
        - $ref: "#/components/parameters/InvitationId"
      responses:
        "204":
          description: Invitation revoked
        "401":
          description: Authentication required
        "403":
          description: Administrator access required
        "404":
          description: Pending invitation not found
        "502":
          description: Identity provider rejected the revocation
  /users/{userId}:
    patch:
      operationId: updateWorkspaceUser
      tags: [users]
      summary: Update a workspace user's profile and role
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceUserUpdate"
      responses:
        "200":
          description: Updated workspace user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceUser"
        "400":
          description: Invalid profile update
        "401":
          description: Authentication required
        "403":
          description: Administrator access required or final administrator protected
        "404":
          description: User not found
        "409":
          description: Email is already in use
        "502":
          description: Identity provider rejected the update
    delete:
      operationId: deleteWorkspaceUser
      tags: [users]
      summary: Delete a workspace user
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "204":
          description: User deleted
        "401":
          description: Authentication required
        "403":
          description: Administrator access required, self-deletion blocked, or final administrator protected
        "404":
          description: User not found
        "502":
          description: Identity provider rejected the deletion
components:
  parameters:
    ImportId:
      name: importId
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
    TradeId:
      name: tradeId
      in: path
      required: true
      schema:
        type: string
    QuoteId:
      name: quoteId
      in: path
      required: true
      schema:
        type: string
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    InvitationId:
      name: invitationId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
  schemas:
    WorkspaceRole:
      type: string
      enum: [Admin, Project Manager, Field Team, Client]
    CurrentWorkspaceUser:
      type: object
      required: [userId, role]
      properties:
        userId: { type: string }
        role:
          $ref: "#/components/schemas/WorkspaceRole"
    WorkspaceUser:
      type: object
      required: [id, firstName, lastName, name, email, role, createdAt, imageUrl]
      properties:
        id: { type: string }
        firstName: { type: string }
        lastName: { type: string }
        name: { type: string }
        email: { type: string, format: email }
        role:
          $ref: "#/components/schemas/WorkspaceRole"
        createdAt: { type: integer }
        lastSignInAt: { type: [integer, "null"] }
        imageUrl: { type: string }
    WorkspaceInvitationInput:
      type: object
      additionalProperties: false
      required: [email, role]
      properties:
        email:
          type: string
          format: email
          minLength: 3
          maxLength: 254
        role:
          $ref: "#/components/schemas/WorkspaceRole"
    WorkspaceInvitation:
      type: object
      required: [id, email, role, status, createdAt]
      properties:
        id: { type: string }
        email: { type: string, format: email }
        role:
          $ref: "#/components/schemas/WorkspaceRole"
        status: { type: string }
        createdAt: { type: integer }
    WorkspaceUserUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        firstName:
          type: string
          minLength: 1
          maxLength: 100
        lastName:
          type: string
          minLength: 1
          maxLength: 100
        email:
          type: string
          format: email
          minLength: 3
          maxLength: 254
        role:
          $ref: "#/components/schemas/WorkspaceRole"
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    DashboardSummary:
      type: object
      required: [activeProjects, awaitingApproval, unreadMessages, new360Photos, budgeted, invoiced, recentActivity]
      properties:
        activeProjects:
          type: integer
        awaitingApproval:
          type: integer
        unreadMessages:
          type: integer
        new360Photos:
          type: integer
        budgeted:
          type: integer
        invoiced:
          type: integer
        recentActivity:
          type: array
          items:
            $ref: "#/components/schemas/Activity"
    Project:
      type: object
      required: [id, name, address, region, status, progress, pmName, clientName, targetDate, budgeted, invoiced, exteriorImage, description]
      properties:
        id: { type: string }
        name: { type: string }
        address: { type: string }
        region: { type: string }
        status: { type: string }
        progress: { type: integer }
        pmName: { type: string }
        clientName: { type: string }
        targetDate: { type: string }
        budgeted: { type: integer }
        invoiced: { type: integer }
        exteriorImage: { type: string }
        description: { type: string }
    ProjectInput:
      type: object
      required: [name, address, region, status, pmName, clientName, targetDate, budgeted, description]
      properties:
        name: { type: string }
        address: { type: string }
        region: { type: string }
        status: { type: string }
        pmName: { type: string }
        clientName: { type: string }
        targetDate: { type: string }
        budgeted: { type: integer }
        description: { type: string }
        exteriorImage: { type: string }
    ProjectUpdate:
      type: object
      properties:
        name: { type: string }
        status: { type: string }
        progress: { type: integer }
        targetDate: { type: string }
        description: { type: string }
        exteriorImage:
          type: [string, "null"]
          description: URL of an existing standard photo belonging to this project, or null to clear the exterior photo
    ProjectDetail:
      allOf:
        - $ref: "#/components/schemas/Project"
        - type: object
          required: [startDate, clientQuote, lineItems, invoices, trades, photos, files, panoramas, activity]
          properties:
            startDate: { type: string }
            clientQuote: { $ref: "#/components/schemas/ClientQuote" }
            lineItems:
              type: array
              items:
                $ref: "#/components/schemas/BudgetLineItem"
            invoices:
              type: array
              items:
                $ref: "#/components/schemas/Invoice"
            trades:
              type: array
              items:
                $ref: "#/components/schemas/Trade"
            photos:
              type: array
              items:
                $ref: "#/components/schemas/Photo"
            files:
              type: array
              items:
                $ref: "#/components/schemas/ProjectFile"
            panoramas:
              type: array
              items:
                $ref: "#/components/schemas/Panorama"
            activity:
              type: array
              items:
                $ref: "#/components/schemas/Activity"
    ClientQuote:
      type: object
      required: [total, revision, portions]
      properties:
        total: { type: integer }
        revision: { type: string }
        portions:
          type: array
          items:
            $ref: "#/components/schemas/QuotePortion"
    QuotePortion:
      type: object
      required: [code, label, amount]
      properties:
        code: { type: string }
        label: { type: string }
        amount: { type: integer }
    BudgetLineItem:
      type: object
      required: [id, code, description, budgeted, invoiced, variance]
      properties:
        id: { type: string }
        code: { type: string }
        description: { type: string }
        budgeted: { type: integer }
        invoiced: { type: integer }
        variance: { type: integer }
    Trade:
      type: object
      required: [id, companyName, contactName, tradeType, region, rating, reviewCount, completedJobs, initials, accent]
      properties:
        id: { type: string }
        companyName: { type: string }
        contactName: { type: string }
        tradeType: { type: string }
        region: { type: string }
        rating: { type: number }
        reviewCount: { type: integer }
        completedJobs: { type: integer }
        initials: { type: string }
        accent: { type: string }
    TradeDetail:
      allOf:
        - $ref: "#/components/schemas/Trade"
        - type: object
          required: [phone, email, website, licence, insuranceExpiry, regions, reviews, jobHistory, bids]
          properties:
            phone: { type: string }
            email: { type: string }
            website: { type: string }
            licence: { type: string }
            insuranceExpiry: { type: string }
            regions:
              type: array
              items: { type: string }
            reviews:
              type: array
              items:
                $ref: "#/components/schemas/Review"
            jobHistory:
              type: array
              items:
                type: object
                required: [projectName, date, amount]
                properties:
                  projectName: { type: string }
                  date: { type: string }
                  amount: { type: integer }
            bids:
              type: array
              items:
                $ref: "#/components/schemas/TradeBid"
    Review:
      type: object
      required: [projectName, reviewer, date, rating, comment]
      properties:
        projectName: { type: string }
        reviewer: { type: string }
        date: { type: string }
        rating: { type: integer }
        comment: { type: string }
    TradeBid:
      type: object
      required: [projectName, scope, amount, date, outcome]
      properties:
        projectName: { type: string }
        scope: { type: string }
        amount: { type: integer }
        date: { type: string }
        outcome: { type: string }
    Invoice:
      type: object
      required: [id, invoiceNumber, projectId, projectName, vendor, amount, date, status, lineItem, overage]
      properties:
        id: { type: string }
        invoiceNumber: { type: string }
        projectId: { type: string }
        projectName: { type: string }
        vendor: { type: string }
        amount: { type: integer }
        date: { type: string }
        status: { type: string }
        lineItem: { type: string }
