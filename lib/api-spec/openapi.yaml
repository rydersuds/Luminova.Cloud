openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: dashboard
    description: Dashboard summaries
  - name: projects
    description: Construction projects
  - name: trades
    description: Trade directory
  - name: invoices
    description: Invoice intake and approval
  - name: vendor-quotes
    description: Vendor and subcontractor quote management
  - name: users
    description: Workspace user administration
  - name: storage
    description: Persistent object upload and serving
  - name: project-imports
    description: AI-assisted project folder initialization
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get dashboard summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /projects:
    get:
      operationId: getProjects
      tags: [projects]
      summary: List accessible projects
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
            maxLength: 100
        - name: region
          in: query
          schema:
            type: string
        - name: client
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Project list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
    post:
      operationId: createProject
      tags: [projects]
      summary: Create a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectInput"
      responses:
        "201":
          description: Created project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
  /projects/{projectId}:
    get:
      operationId: getProject
      tags: [projects]
      summary: Get a project
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Project details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectDetail"
        "404":
          description: Project not found
    patch:
      operationId: updateProject
      tags: [projects]
      summary: Update a project
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUpdate"
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
  /projects/{projectId}/panoramas:
    post:
      operationId: createProjectPanorama
      tags: [projects]
      summary: Add a panorama to a project
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PanoramaInput"
      responses:
        "201":
          description: Created panorama
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Panorama"
        "400":
          description: Invalid panorama upload
        "404":
          description: Project not found
        "500":
          description: Panorama could not be persisted
  /projects/{projectId}/panoramas/{panoramaId}:
    patch:
      operationId: updateProjectPanorama
      tags: [projects]
      summary: Update panorama details
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: panoramaId
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PanoramaUpdate"
      responses:
        "200":
          description: Updated panorama
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Panorama"
        "400":
          description: Invalid panorama details
        "404":
          description: Project or panorama not found
        "500":
          description: Panorama details could not be persisted
  /projects/{projectId}/schedule-images:
    post:
      operationId: createProjectScheduleImage
      tags: [projects]
      summary: Add a schedule image to a project
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleImageInput"
      responses:
        "201":
          description: Created schedule image
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleImage"
        "400":
          description: Invalid schedule image upload
        "401":
          description: Authentication required
        "404":
          description: Project not found
  /projects/{projectId}/schedule-images/{scheduleImageId}:
    patch:
      operationId: updateProjectScheduleImage
      tags: [projects]
      summary: Update schedule image revision details or designate it as current
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: scheduleImageId
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleImageUpdate"
      responses:
        "200":
          description: Updated schedule image
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleImage"
        "400":
          description: Invalid schedule image details
        "403":
          description: Project management access required
        "404":
          description: Project or schedule image not found
    delete:
      operationId: deleteProjectScheduleImage
      tags: [projects]
      summary: Remove a schedule image from a project
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: scheduleImageId
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        "204":
          description: Schedule image removed
        "400":
          description: Invalid schedule image
        "401":
          description: Authentication required
        "404":
          description: Project or schedule image not found
        "500":
          description: Schedule image could not be removed
  /projects/{projectId}/schedule-images/{documentId}/restore:
    post:
      operationId: restoreProjectScheduleImage
      tags: [projects]
      summary: Restore a project image document to the schedule gallery
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: documentId
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        "200":
          description: Restored schedule image
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleImage"
        "400":
          description: Invalid image document
        "401":
          description: Authentication required
        "404":
          description: Project or image document not found
        "500":
          description: Schedule image could not be restored
  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [storage]
      summary: Request a direct upload URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Upload URL generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
        "400":
          description: Invalid file metadata
        "500":
          description: Upload URL could not be generated
  /storage/objects/{objectPath}:
    get:
      operationId: getStorageObject
      tags: [storage]
      summary: Serve a stored object
      parameters:
        - name: objectPath
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Stored object
          content:
            "*/*":
              schema: { type: string, format: binary }
        "403":
          description: Access denied
        "404":
          description: Object not found
  /project-imports:
    post:
      operationId: createProjectImport
      tags: [project-imports]
      summary: Build a project from privately uploaded folder documents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectImportInput"
      responses:
        "201":
          description: Project initialized from the document import
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectImport"
        "400":
          description: Invalid imported document metadata
        "422":
          description: Import could not be interpreted
  /project-import-sessions:
    post:
      operationId: createProjectImportSession
      tags: [project-imports]
      summary: Create a durable folder import session before uploading
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectImportSessionInput"
      responses:
        "201":
          description: Import session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectImportSession"
    get:
      operationId: getActiveProjectImportSession
      tags: [project-imports]
      summary: Restore the latest unfinished folder import
      responses:
        "200":
          description: Active import session, or null
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ProjectImportSession"
                  - type: "null"
  /project-import-sessions/{importId}:
    get:
      operationId: getProjectImportSession
      tags: [project-imports]
      summary: Get an exact folder import session for build reconciliation
      parameters:
        - $ref: "#/components/parameters/ImportId"
      responses:
        "200":
          description: Import session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectImportSession"
        "404":
          description: Import session not found
    delete:
      operationId: dismissProjectImportSession
      tags: [project-imports]
      summary: Dismiss an unfinished folder import so it is no longer restored
      parameters:
        - $ref: "#/components/parameters/ImportId"
      responses:
        "204":
          description: Import session dismissed
        "404":
          description: Import session not found
        "409":
          description: Import session is currently building
  /project-import-sessions/{importId}/documents:
    post:
      operationId: attachProjectImportDocument
      tags: [project-imports]
      parameters:
        - $ref: "#/components/parameters/ImportId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectImportDocument"
      responses:
        "200":
          description: Uploaded document attached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectImportSession"
  /project-import-sessions/{importId}/build:
    post:
      operationId: buildProjectImportSession
      tags: [project-imports]
      parameters:
        - $ref: "#/components/parameters/ImportId"
      responses:
        "201":
          description: Project initialized from attached documents
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectImport"
  /projects/{projectId}/activity:
    get:
      operationId: getProjectActivity
      tags: [projects]
      summary: Get project activity
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Activity feed
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Activity"
  /projects/{projectId}/organize-files:
    post:
      operationId: organizeProjectFiles
      tags: [projects]
      summary: Organize imported project files with AI
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Files organized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizeProjectFilesResult"
  /projects/{projectId}/vendor-quotes/rescan:
    post:
      operationId: rescanProjectVendorQuotes
      tags: [vendor-quotes]
      summary: Scan existing project documents for vendor quotes
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Document scan completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VendorQuoteRescanResult"
        "401":
          description: Authentication required
        "404":
          description: Imported project not found
  /trades:
    get:
      operationId: getTrades
      tags: [trades]
      summary: List trades
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: tradeType
          in: query
          schema:
            type: string
        - name: region
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Trade directory
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Trade"
  /trades/{tradeId}:
    get:
      operationId: getTrade
      tags: [trades]
      summary: Get a trade profile
      parameters:
        - $ref: "#/components/parameters/TradeId"
      responses:
        "200":
          description: Trade profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TradeDetail"
    patch:
      operationId: updateTrade
      tags: [trades]
      summary: Update a vendor profile
      parameters:
        - $ref: "#/components/parameters/TradeId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTradeProfileInput"
      responses:
        "200":
          description: Updated vendor profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trade"
        "400":
          description: Invalid vendor profile
        "401":
          description: Authentication required
        "404":
          description: Vendor not found
  /trades/{tradeId}/profile-photo-upload:
    post:
      operationId: requestTradeProfilePhotoUpload
      tags: [trades]
      summary: Request a private vendor logo or profile image upload
      parameters:
        - $ref: "#/components/parameters/TradeId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Vendor photo upload URL generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
        "400":
          description: Invalid photo metadata
        "404":
          description: Vendor not found
  /trades/{tradeId}/job-history:
    post:
      operationId: createTradeJobHistory
      tags: [trades]
      summary: Record verified vendor job history
      parameters:
        - $ref: "#/components/parameters/TradeId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VendorJobHistoryInput"
      responses:
        "201":
          description: Recorded job history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VendorJobHistory"
        "400":
          description: Invalid job history or project
        "403":
          description: Administrator access required
        "404":
          description: Trade or project not found
  /trades/{tradeId}/job-history/{historyId}:
    patch:
      operationId: updateTradeJobHistory
      tags: [trades]
      summary: Update verified vendor job history
      parameters:
        - $ref: "#/components/parameters/TradeId"
        - name: historyId
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VendorJobHistoryInput"
      responses:
        "200":
          description: Updated job history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VendorJobHistory"
        "400":
          description: Invalid job history or project
        "403":
          description: Administrator access required
        "404":
          description: Job history, trade, or project not found
    delete:
      operationId: deleteTradeJobHistory
      tags: [trades]
      summary: Remove verified vendor job history
      parameters:
        - $ref: "#/components/parameters/TradeId"
        - name: historyId
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        "204":
          description: Job history removed
        "403":
          description: Administrator access required
        "404":
          description: Job history or trade not found
  /trades/{tradeId}/reviews:
    post:
      operationId: createTradeReview
      tags: [trades]
      summary: Submit a verified vendor review
      parameters:
        - $ref: "#/components/parameters/TradeId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VendorReviewInput"
      responses:
        "201":
          description: Submitted review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"
        "400":
          description: Invalid review or project
        "403":
          description: Reviewer access required
        "404":
          description: Trade or completed project not found
  /trades/{tradeId}/reviews/{reviewId}:
    patch:
      operationId: updateTradeReview
      tags: [trades]
      summary: Correct a submitted vendor review
      parameters:
        - $ref: "#/components/parameters/TradeId"
        - name: reviewId
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VendorReviewUpdateInput"
      responses:
        "200":
          description: Corrected review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"
        "400":
          description: Invalid review update
        "403":
          description: Administrator access required
        "404":
          description: Review or trade not found
    delete:
      operationId: deleteTradeReview
      tags: [trades]
      summary: Remove a submitted vendor review
      parameters:
        - $ref: "#/components/parameters/TradeId"
        - name: reviewId
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        "204":
          description: Review removed
        "403":
          description: Administrator access required
        "404":
          description: Review or trade not found
  /invoices:
    get:
      operationId: getInvoices
      tags: [invoices]
      summary: List invoices
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
            maxLength: 100
      responses:
        "200":
          description: Invoice list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Invoice"
    post:
      operationId: createInvoice
      tags: [invoices]
      summary: Submit an invoice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvoiceInput"
      responses:
        "201":
          description: Created invoice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
  /invoices/summary:
    get:
      operationId: getFinancialSummary
      tags: [invoices]
      summary: Get portfolio financial summary
      description: >-
        Aggregates all project invoices and accepted Luminova-to-client quotes.
        A directionless legacy invoice is treated as client revenue only when the
        persisted project's invoiced total accounts for that legacy amount; otherwise
        it remains a company-to-Luminova expense. Persisted internal budget actuals
        are used when available.
        Accepted quote revisions and overlapping project-total quotes are counted once,
        and each project's remaining client value is floored at zero.
      responses:
        "200":
          description: Portfolio financial summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinancialSummary"
  /search:
    get:
      operationId: searchWorkspace
      tags: [search]
      summary: Search persisted workspace records
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 100
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 30
            default: 12
      responses:
        "200":
          description: Matching workspace records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkspaceSearchResult"
        "400":
          description: Invalid search query
        "401":
          description: Authentication required
  /conversations:
    get:
      operationId: getProjectConversations
      tags: [communications]
      summary: List chats the authenticated user participates in
      responses:
        "200":
          description: Direct and project chats with persisted messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectConversation"
        "401":
          description: Authentication required
    post:
      operationId: createProjectConversation
      tags: [communications]
      summary: Create a direct or project chat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectConversationInput"
      responses:
        "201":
          description: Created conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectConversation"
        "400":
          description: Invalid conversation
        "401":
          description: Authentication required
        "404":
          description: Project or participant not found
        "403":
          description: Participant is not eligible for the selected project
  /conversations/options:
    get:
      operationId: getChatOptions
      tags: [communications]
      summary: List eligible chat participants and projects
      responses:
        "200":
          description: Chat creation options for the authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatOptions"
        "401":
          description: Authentication required
  /conversations/{conversationId}:
    get:
      operationId: getProjectConversation
      tags: [communications]
      summary: Get a chat the authenticated user participates in
      parameters:
        - name: conversationId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Project conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectConversation"
        "401":
          description: Authentication required
        "404":
          description: Conversation not found
  /conversations/{conversationId}/messages:
    post:
      operationId: createProjectMessage
      tags: [communications]
      summary: Add a message to a chat the authenticated user participates in
      parameters:
        - name: conversationId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectMessageInput"
      responses:
        "201":
          description: Created message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectMessage"
        "400":
          description: Invalid message
        "401":
          description: Authentication required
        "404":
          description: Conversation not found
  /vendor-quotes:
    get:
      operationId: getVendorQuotes
      tags: [vendor-quotes]
      summary: List and filter vendor quotes
      parameters:
        - name: search
          in: query
          schema: { type: string }
        - name: projectId
          in: query
          schema: { type: string }
        - name: vendorId
          in: query
          schema: { type: string }
        - name: trade
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/VendorQuoteStatus"
        - name: direction
          in: query
          schema:
            $ref: "#/components/schemas/QuoteDirection"
      responses:
        "200":
          description: Vendor quote list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VendorQuote"
    post:
      operationId: createVendorQuote
      tags: [vendor-quotes]
      summary: Create a vendor quote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VendorQuoteInput"
      responses:
        "201":
          description: Created vendor quote
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VendorQuote"
        "400":
          description: Invalid quote
        "404":
          description: Project or vendor not found
  /vendor-quotes/{quoteId}:
    get:
      operationId: getVendorQuote
      tags: [vendor-quotes]
      summary: Get a vendor quote
      parameters:
        - $ref: "#/components/parameters/QuoteId"
      responses:
        "200":
          description: Vendor quote
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VendorQuote"
        "404":
          description: Quote not found
    patch:
      operationId: updateVendorQuote
      tags: [vendor-quotes]
      summary: Update a vendor quote
      parameters:
        - $ref: "#/components/parameters/QuoteId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VendorQuoteUpdate"
      responses:
        "200":
          description: Updated vendor quote
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VendorQuote"
        "400":
          description: Invalid quote
        "404":
          description: Quote, project, or vendor not found
  /users/me:
    get:
      operationId: getCurrentWorkspaceUser
      tags: [users]
      summary: Get the current workspace identity and role
      responses:
        "200":
          description: Current workspace user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentWorkspaceUser"
        "401":
          description: Authentication required
  /users:
    get:
      operationId: getWorkspaceUsers
      tags: [users]
      summary: List workspace users
      responses:
        "200":
          description: Workspace user list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkspaceUser"
        "401":
          description: Authentication required
        "403":
          description: Administrator access required
  /users/project-managers:
    get:
      operationId: getProjectManagers
      tags: [users]
      summary: List eligible project managers
      responses:
        "200":
          description: Project managers available for project assignment
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectManager"
        "401":
          description: Authentication required
        "403":
          description: Administrator access required
  /users/client-access-reconciliation:
    post:
      operationId: reconcileAllClientAccess
      tags: [users]
      summary: Reconcile all pending client access cleanups
      responses:
        "200":
          description: Per-user client access reconciliation results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkClientAccessReconciliationResponse"
        "401":
          description: Authentication required
        "403":
          description: Administrator access required
  /users/{userId}/client-access-reconciliation:
    post:
      operationId: reconcileClientAccess
      tags: [users]
      summary: Reconcile a user's client access after a failed cleanup
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "204":
          description: Client access reconciled
        "401":
          description: Authentication required
        "403":
          description: Administrator access required
        "404":
          description: User not found
        "503":
          description: Client access cleanup failed again
  /clients:
    get:
      operationId: getClients
      tags: [users]
      summary: List client organizations and their members
      responses:
        "200":
          description: Client organization list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Client"
        "401":
          description: Authentication required
        "403":
          description: Administrator access required
    post:
      operationId: createClient
      tags: [users]
      summary: Create a client organization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientInput"
      responses:
        "201":
          description: Client organization created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
        "400":
          description: Invalid client
        "401":
          description: Authentication required
        "403":
          description: Administrator access required
        "409":
          description: Client already exists
  /clients/{clientId}/logo-upload:
    post:
      operationId: requestClientLogoUpload
      tags: [users]
      summary: Request a direct upload URL for a client logo
      parameters:
        - $ref: "#/components/parameters/ClientId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientLogoUploadInput"
      responses:
        "200":
          description: Client logo upload URL generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
        "400":
          description: Invalid client logo metadata
        "401":
          description: Authentication required
        "403":
          description: Administrator access required
        "404":
          description: Client not found
  /clients/{clientId}/logo:
    put:
      operationId: attachClientLogo
      tags: [users]
      summary: Attach an uploaded client logo
      parameters:
        - $ref: "#/components/parameters/ClientId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientLogoInput"
      responses:
        "200":
          description: Client with the attached logo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
        "400":
          description: Invalid or incomplete client logo upload
        "401":
          description: Authentication required
        "403":
          description: Administrator access required
        "404":
          description: Client or upload not found
    delete:
      operationId: clearClientLogo
      tags: [users]
      summary: Remove a client logo
      parameters:
        - $ref: "#/components/parameters/ClientId"
      responses:
        "200":
          description: Client without a logo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
        "401":
          description: Authentication required
        "403":
          description: Administrator access required
        "404":
          description: Client not found
  /clients/{clientId}:
    delete:
      operationId: deleteClient
      tags: [users]
      summary: Delete a client organization
      parameters:
        - $ref: "#/components/parameters/ClientId"
      responses:
        "204":
          description: Client organization deleted
        "401":
          description: Authentication required
        "403":
          description: Administrator access required
        "404":
          description: Client not found
  /clients/{clientId}/members:
    post:
      operationId: grantClientAccess
      tags: [users]
      summary: Grant a workspace client user access to a client organization
      parameters:
        - $ref: "#/components/parameters/ClientId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientMemberInput"
      responses:
        "201":
          description: Client access granted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
        "400":
          description: Invalid client member
        "401":
          description: Authentication required
        "403":
          description: Administrator access required or user is not a Client
        "404":
          description: Client or user not found
        "409":
          description: User already has access
  /clients/{clientId}/invitations:
    post:
      operationId: inviteClientUser
      tags: [users]
      summary: Invite a new Client user to a client organization
      parameters:
        - $ref: "#/components/parameters/ClientId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientInvitationInput"
      responses:
        "201":
          description: Client invitation sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceInvitation"
        "400":
          description: Invalid email address
        "401":
          description: Authentication required
        "403":
          description: Administrator access required
        "404":
          description: Client not found
        "409":
          description: Duplicate invitation or existing workspace user
        "502":
          description: Identity provider rejected the invitation
  /clients/{clientId}/members/{userId}:
    delete:
      operationId: revokeClientAccess
      tags: [users]
      summary: Revoke a workspace user's access to a client organization
      parameters:
        - $ref: "#/components/parameters/ClientId"
        - $ref: "#/components/parameters/UserId"
      responses:
        "204":
          description: Client access revoked
        "401":
          description: Authentication required
        "403":
          description: Administrator access required
        "404":
          description: Client membership not found
  /users/invitations:
    get:
      operationId: getWorkspaceInvitations
      tags: [users]
      summary: List pending workspace invitations
      responses:
        "200":
          description: Pending workspace invitation list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkspaceInvitation"
        "401":
          description: Authentication required
        "403":
          description: Administrator access required
    post:
      operationId: inviteWorkspaceUser
      tags: [users]
      summary: Invite a user with an initial workspace role
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceInvitationInput"
      responses:
        "201":
          description: Invitation sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceInvitation"
        "400":
          description: Invalid invitation
        "401":
          description: Authentication required
        "403":
          description: Administrator access required
        "409":
          description: Email is already invited or registered
        "502":
          description: Identity provider rejected the invitation
  /users/invitations/{invitationId}/resend:
    post:
      operationId: resendWorkspaceInvitation
      tags: [users]
      summary: Resend a pending workspace invitation
      parameters:
        - $ref: "#/components/parameters/InvitationId"
      responses:
        "200":
          description: Replacement invitation sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceInvitation"
        "401":
          description: Authentication required
        "403":
          description: Administrator access required
        "404":
          description: Pending invitation not found
        "502":
          description: Identity provider rejected the invitation
  /users/invitations/{invitationId}:
    delete:
      operationId: revokeWorkspaceInvitation
      tags: [users]
      summary: Revoke a pending workspace invitation
      parameters:
        - $ref: "#/components/parameters/InvitationId"
      responses:
        "204":
          description: Invitation revoked
        "401":
          description: Authentication required
        "403":
          description: Administrator access required
        "404":
          description: Pending invitation not found
        "502":
          description: Identity provider rejected the revocation
  /users/{userId}:
    patch:
      operationId: updateWorkspaceUser
      tags: [users]
      summary: Update a workspace user's profile and role
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceUserUpdate"
      responses:
        "200":
          description: Updated workspace user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceUser"
        "400":
          description: Invalid profile update
        "401":
          description: Authentication required
        "403":
          description: Administrator access required or final administrator protected
        "404":
          description: User not found
        "409":
          description: Email is already in use
        "502":
          description: Identity provider rejected the update
    delete:
      operationId: deleteWorkspaceUser
      tags: [users]
      summary: Delete a workspace user
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "204":
          description: User deleted
        "401":
          description: Authentication required
        "403":
          description: Administrator access required, self-deletion blocked, or final administrator protected
        "404":
          description: User not found
        "502":
          description: Identity provider rejected the deletion
components:
  parameters:
    ImportId:
      name: importId
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
    TradeId:
      name: tradeId
      in: path
      required: true
      schema:
        type: string
    QuoteId:
      name: quoteId
      in: path
      required: true
      schema:
        type: string
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    InvitationId:
      name: invitationId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    ClientId:
      name: clientId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
  schemas:
    WorkspaceRole:
      type: string
      enum: [Admin, Project Manager, Field Team, Client]
    CurrentWorkspaceUser:
      type: object
      required: [userId, role]
      properties:
        userId: { type: string }
        role:
          $ref: "#/components/schemas/WorkspaceRole"
    WorkspaceUser:
      type: object
      required: [id, firstName, lastName, name, email, role, createdAt, imageUrl, clientAccessCleanupPending]
      properties:
        id: { type: string }
        firstName: { type: string }
        lastName: { type: string }
        name: { type: string }
        email: { type: string, format: email }
        role:
          $ref: "#/components/schemas/WorkspaceRole"
        createdAt: { type: integer }
        lastSignInAt: { type: [integer, "null"] }
        imageUrl: { type: string }
        clientAccessCleanupPending: { type: boolean }
    ProjectManager:
      type: object
      required: [id, name, email]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string, format: email }
    BulkClientAccessReconciliationResponse:
      type: object
      required: [reconciled, failed]
      properties:
        reconciled:
          type: array
          items: { type: string }
        failed:
          type: array
          items:
            type: object
            required: [userId, error]
            properties:
              userId: { type: string }
              error: { type: string }
    ClientMember:
      type: object
      required: [id, userId, name, email, imageUrl, role, addedAt]
      properties:
        id: { type: string }
        userId: { type: string }
        name: { type: string }
        email: { type: string, format: email }
        imageUrl: { type: string }
        role:
          $ref: "#/components/schemas/WorkspaceRole"
        addedAt: { type: integer }
    Client:
      type: object
      required: [id, name, logoUrl, createdAt, members, pendingInvitations]
      properties:
        id: { type: string }
        name: { type: string }
        logoUrl: { type: [string, "null"] }
        createdAt: { type: integer }
        members:
          type: array
          items:
            $ref: "#/components/schemas/ClientMember"
        pendingInvitations:
          type: array
          items:
            $ref: "#/components/schemas/ClientPendingInvitation"
    ClientInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 160
    ClientLogoUploadInput:
      type: object
      additionalProperties: false
      required: [name, size, contentType]
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        size: { type: integer, minimum: 1, maximum: 8388608 }
        contentType: { type: string, enum: [image/jpeg, image/png, image/webp] }
    ClientLogoInput:
      type: object
      additionalProperties: false
      required: [objectPath]
      properties:
        objectPath:
          type: string
          pattern: '^/objects/uploads/[A-Za-z0-9_-]+$'
    ClientMemberInput:
      type: object
      additionalProperties: false
      required: [userId]
      properties:
        userId:
          type: string
          minLength: 1
    ClientInvitationInput:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
    ClientPendingInvitation:
      type: object
      required: [id, email, role, status, createdAt]
      properties:
        id: { type: string }
        email: { type: string, format: email }
        role:
          $ref: "#/components/schemas/WorkspaceRole"
        status: { type: string }
        createdAt: { type: integer }
    WorkspaceInvitationInput:
      type: object
      additionalProperties: false
      required: [email, role]
      properties:
        email:
          type: string
          format: email
          minLength: 3
          maxLength: 254
        role:
          $ref: "#/components/schemas/WorkspaceRole"
    WorkspaceInvitation:
      type: object
      required: [id, email, role, status, createdAt]
      properties:
        id: { type: string }
        email: { type: string, format: email }
        role:
          $ref: "#/components/schemas/WorkspaceRole"
        status: { type: string }
        createdAt: { type: integer }
    WorkspaceUserUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        firstName:
          type: string
          minLength: 1
          maxLength: 100
        lastName:
          type: string
          minLength: 1
          maxLength: 100
        email:
          type: string
          format: email
          minLength: 3
          maxLength: 254
        role:
          $ref: "#/components/schemas/WorkspaceRole"
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    WorkspaceSearchResult:
      type: object
      required: [id, kind, title, subtitle, href]
      properties:
        id: { type: string }
        kind:
          type: string
          enum: [project, vendor, quote, invoice, message]
        title: { type: string }
        subtitle: { type: string }
        href: { type: string }
    ChatParticipant:
      type: object
      required: [id, name, email, imageUrl, role]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string }
        imageUrl: { type: string }
        role:
          $ref: "#/components/schemas/WorkspaceRole"
    ChatProjectOption:
      type: object
      required: [id, name, clientName, eligibleParticipantIds]
      properties:
        id: { type: string }
        name: { type: string }
        clientName: { type: string }
        eligibleParticipantIds:
          type: array
          items: { type: string }
    ChatOptions:
      type: object
      required: [currentUserId, participants, projects]
      properties:
        currentUserId: { type: string }
        participants:
          type: array
          items:
            $ref: "#/components/schemas/ChatParticipant"
        projects:
          type: array
          items:
            $ref: "#/components/schemas/ChatProjectOption"
    ProjectMessage:
      type: object
      required: [id, conversationId, projectId, senderId, sender, text, createdAt]
      properties:
        id: { type: string }
        conversationId: { type: string }
        projectId: { type: [string, "null"] }
        senderId: { type: string }
        sender:
          $ref: "#/components/schemas/ChatParticipant"
        text: { type: string }
        createdAt: { type: string, format: date-time }
    ProjectMessageInput:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 5000
    ProjectConversation:
      type: object
      required: [id, type, projectId, projectName, title, context, participants, createdAt, updatedAt, messages]
      properties:
        id: { type: string }
        type: { type: string, enum: [direct, project] }
        projectId: { type: [string, "null"] }
        projectName: { type: [string, "null"] }
        title: { type: string }
        context: { type: string }
        participants:
          type: array
          items:
            $ref: "#/components/schemas/ChatParticipant"
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        messages:
          type: array
          items:
            $ref: "#/components/schemas/ProjectMessage"
    ProjectConversationInput:
      type: object
      additionalProperties: false
      required: [type, participantIds]
      properties:
        type: { type: string, enum: [direct, project] }
        projectId: { type: string, minLength: 1 }
        title: { type: string, minLength: 1, maxLength: 160 }
        context: { type: string, maxLength: 200, default: Project channel }
        participantIds:
          type: array
          minItems: 1
          maxItems: 50
          uniqueItems: true
          items: { type: string, minLength: 1 }
    DashboardSummary:
      type: object
      required: [activeProjects, awaitingApproval, unreadMessages, new360Photos, budgeted, invoiced, recentActivity]
      properties:
        activeProjects:
          type: integer
        awaitingApproval:
          type: integer
        unreadMessages:
          type: integer
        new360Photos:
          type: integer
        budgeted:
          type: number
        invoiced:
          type: number
        recentActivity:
          type: array
          items:
            $ref: "#/components/schemas/Activity"
    Project:
      type: object
      required: [id, name, address, region, status, progress, pmName, projectManagerId, clientName, targetDate, budgeted, invoiced, exteriorImage, description]
      properties:
        id: { type: string }
        name: { type: string }
        address: { type: string }
        region: { type: string }
        status: { type: string }
        progress: { type: number }
        pmName: { type: string }
        projectManagerId: { type: [string, "null"] }
        clientName: { type: string }
        clientLogoUrl: { type: [string, "null"] }
        targetDate: { type: string }
        budgeted: { type: number }
        invoiced: { type: number }
        exteriorImage: { type: string }
        description: { type: string }
    ProjectInput:
      type: object
      additionalProperties: false
      required: [name, address, region, status, projectManagerId, clientName, targetDate, budgeted, description]
      properties:
        name: { type: string }
        address: { type: string }
        region: { type: string }
        status: { type: string }
        projectManagerId: { type: string, minLength: 1 }
        clientName: { type: string }
        targetDate: { type: string }
        budgeted: { type: number }
        description: { type: string }
        exteriorImage: { type: string }
    ProjectUpdate:
      type: object
      additionalProperties: false
      properties:
        name: { type: string }
        status: { type: string }
        progress: { type: integer }
        targetDate: { type: string }
        description: { type: string }
        projectManagerId: { type: string, minLength: 1 }
        exteriorImage:
          type: [string, "null"]
          description: URL of an existing standard photo belonging to this project, or null to clear the exterior photo
    ProjectDetail:
      allOf:
        - $ref: "#/components/schemas/Project"
        - type: object
          required: [startDate, clientQuote, lineItems, invoices, trades, photos, files, panoramas, scheduleImages, activity]
          properties:
            startDate: { type: string }
            clientQuote: { $ref: "#/components/schemas/ClientQuote" }
            lineItems:
              type: array
              items:
                $ref: "#/components/schemas/BudgetLineItem"
            invoices:
              type: array
              items:
                $ref: "#/components/schemas/Invoice"
            trades:
              type: array
              items:
                $ref: "#/components/schemas/Trade"
            photos:
              type: array
              items:
                $ref: "#/components/schemas/Photo"
            files:
              type: array
              items:
                $ref: "#/components/schemas/ProjectFile"
            panoramas:
              type: array
              items:
                $ref: "#/components/schemas/Panorama"
            scheduleImages:
              type: array
              items:
                $ref: "#/components/schemas/ScheduleImage"
            activity:
              type: array
              items:
                $ref: "#/components/schemas/Activity"
    ClientQuote:
      type: object
      required: [total, revision, portions]
      properties:
        total: { type: number }
        revision: { type: string }
        portions:
          type: array
          items:
            $ref: "#/components/schemas/QuotePortion"
    QuotePortion:
      type: object
      required: [code, label, amount]
      properties:
        code: { type: string }
        label: { type: string }
        amount: { type: number }
    BudgetLineItem:
      type: object
      required: [id, code, description, budgeted, invoiced, variance]
      properties:
        id: { type: string }
        code: { type: string }
        description: { type: string }
        budgeted: { type: number }
        invoiced: { type: number }
        variance: { type: number }
    Trade:
      type: object
      required: [id, companyName, contactName, tradeType, region, rating, reviewCount, completedJobs, initials, accent]
      properties:
        id: { type: string }
        companyName: { type: string }
        contactName: { type: string }
        tradeType: { type: string }
        region: { type: string }
        rating: { type: number }
        reviewCount: { type: integer }
        completedJobs: { type: integer }
        initials: { type: string }
        accent: { type: string }
        profilePhotoUrl:
          type: string
          nullable: true
        profilePhotoPositionX: { type: number, minimum: 0, maximum: 100 }
        profilePhotoPositionY: { type: number, minimum: 0, maximum: 100 }
        profilePhotoZoom: { type: number, minimum: 1, maximum: 2 }
        phone: { type: string }
        email: { type: string }
        website: { type: string }
        regions:
          type: array
          items: { type: string }
        licence: { type: string }
        insurance: { type: string }
        insuranceExpiry: { type: string }
    TradeDetail:
      allOf:
        - $ref: "#/components/schemas/Trade"
        - type: object
          required: [phone, email, website, licence, insurance, insuranceExpiry, regions, profilePhotoPositionX, profilePhotoPositionY, profilePhotoZoom, reviews, jobHistory, bids]
          properties:
            phone: { type: string }
            email: { type: string }
            website: { type: string }
